[project]
name = "email-triage-env"
version = "0.1.0"
description = "Email triage RL env"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "openenv-core>=0.2.0"
]

# The project files live directly in the (hyphenated) repo root rather than in
# an "email_triage_env/" subfolder, so `packages.find` can't discover the
# package. Map the import name to the root explicitly so `from email_triage_env
# ...` resolves after `pip install -e .`.
[tool.setuptools]
packages = ["email_triage_env", "email_triage_env.server"]

[tool.setuptools.package-dir]
email_triage_env = "."
"email_triage_env.server" = "server"

[project.entry-points."openenv.tasks"]
tasks = "email_triage_env.tasks:TASKS"

[project.entry-points."openenv.envs"]
v1 = "email_triage_env.server.email_triage_env:EmailTriageEnvironment"

[project.scripts]
server = "email_triage_env.server.app:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"